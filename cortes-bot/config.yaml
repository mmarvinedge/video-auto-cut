# Configuração do bot de cortes — um canal de destino por streamer.

pasta_dados: dados   # VODs, chats, candidatos e cortes ficam aqui (uma subpasta por streamer)
pasta_prontos: ../prontos   # cópia dos cortes aprovados no painel, com a legenda em .txt ao lado,
                            # para publicar à mão enquanto as contas não estão vinculadas

corte:                   # 1ª versão: cortes curtos (Shorts / Reels)
  duracao_min: 20        # segundos
  duracao_max: 60        # Shorts/TikTok/Reels: até 60s é o ponto ideal
  margem_antes: 10       # o momento acontece ANTES da reação do chat
  margem_depois: 4
  max_cortes_por_vod: 10   # cortes finais renderizados por live
  max_tela_parada: 0.3   # descarta o corte se >30% dele for imagem parada (tela de pausa com música)

tiktok:                  # 2ª versão: vídeos > 1 min (exigência da monetização do TikTok)
  ativo: true
  duracao_min: 65        # segundos (folga acima de 60s)
  duracao_max: 120
  janela_longa: 90       # tamanho dos trechos longos procurados
  nota_minima_longo: 0.6 # média da nota no trecho; abaixo disso não é "atividade sustentada"
  candidatos_longos: 8   # quantos trechos longos o Whisper ouve
  max_longos_por_live: 3
  max_compilacoes_por_live: 3   # compilações de 2–4 cortes curtos do mesmo tema

deteccao:
  janela: 8              # segundos somados para medir "intensidade" do chat/áudio
  atraso_chat: 5         # o chat reage com atraso (delay da live + tempo de digitar)
  baseline: 300          # janela (s) da média móvel usada como "normal" da live
  peso_chat: 0.65
  peso_audio: 0.35
  nota_minima: 1.8       # em desvios acima do normal; abaixo disso não vira candidato
                         # (com Whisper ligado dá para ser mais permissivo: a fala filtra depois)
  palavras_reacao:       # mensagens com estes termos contam mais
    - KEKW
    - OMEGALUL
    - LUL
    - KEKL
    - Pog
    - monkaS
    - LOL
    - "?"
  regex_risada: "(k{4,}|(ha){3,}|(rs){3,})"

whisper:
  ativo: true
  modelo: large-v3-turbo   # ~1,6 GB; roda na GPU NVIDIA (ou CPU, bem mais lento)
  dispositivo: auto        # auto | cuda | cpu
  candidatos_para_ouvir: 30  # quantos momentos (de áudio/chat) são transcritos antes de escolher
  peso_fala: 1.0           # quanto a fala pesa na nota final, junto com áudio/chat
  legendas: true
  reacoes:                 # expressões que indicam reação forte
    - caralho
    - porra
    - puta
    - meu deus
    - nossa
    - socorro
    - nao acredito
    - que isso
    - morri
    - mentira
    - olha isso
    - cade
    - eita
    - vixe

ia:
  ativo: true              # precisa de ANTHROPIC_API_KEY; sem ela o bot segue sem esta etapa
  contexto: ""             # dica opcional para a IA, ex.: "A live é de GTA 6, lançado em novembro de 2026."

edit:                      # edits de filme: `python -m cortes edit <filme> <musica>`
  gancho_min: 4            # segundos da fala de abertura, com a legenda neon
  gancho_max: 12
  gancho_longo: 40         # quando o tema pede a conversa inteira (a IA decide)
  duracao_musica: 15       # segundos da parte cortada na batida
  corte_min: 0.55          # cada plano dura entre estes valores (múltiplos de batida)
  corte_max: 1.6
  velocidade: 0.85         # câmera lenta dos planos da música (1 = normal)
  proporcao: "4:5"         # "4:5" com tarjas pretas (o visual dos edits) | "9:16" tela cheia
  idioma: pt               # da fala do filme, para o Whisper achar o gancho: pt, en, es... ou auto
  slowed: 0.85             # 1 = música original; 0.85 = o "slowed" do TikTok
  reverb: true
  volume_gancho: 0.18      # a música entra baixinha debaixo da fala e sobe no drop
  musica_no_gancho: true   # false: música muda durante o gancho, entra só no drop (mais impacto)
  drop_fala: depois        # fala do gatilho no drop: depois (ela limpa, o drop quando acaba) | durante
  volume_musica: 1.0       # a música é nivelada (-15 dB RMS); isto multiplica: 0.7 = mais baixa, 1.3 = mais alta
  ritmo: normal            # rapido (um corte por batida) | normal | lento; o tema pode pedir outro
  abertura: false          # falas do filme antes do gancho, sem música (o tema também pode pedir)
  legenda_cor: "FF1E3C"    # brilho da legenda (RGB)
  max_planos_ia: 150       # quantos planos a IA vê (em folhas de 30 miniaturas)
  transicoes: [zoom, flash, chicote, giro, fusao]   # entre os planos; [] = corte seco (docs/edits.md)
  cor: {contraste: 1.12, saturacao: 0.78, brilho: -0.03, vinheta: true, grao: 3}

publicacao:
  fuso: America/Sao_Paulo
  horarios: ["11:00", "14:00", "18:00", "21:00"]   # horários em que a fila publica (um vídeo por conta por horário)
  max_por_dia_por_conta: 4
  youtube:
    # Credencial OAuth "Aplicativo da Web" criada no Google Cloud (veja o README).
    # Redirecionamento autorizado: http://localhost:8800/oauth/youtube/callback
    client_secret: segredos/youtube_client_secret.json
    privacidade: public      # public | unlisted | private (projeto sem auditoria: o YouTube força private)
    categoria: "20"          # 20 = Jogos
    envios_por_dia: 6        # cota padrão do projeto: 10.000 unidades/dia, cada envio gasta 1.600
  tiktok:
    # App do TikTok for Developers (Login Kit "Desktop" + Content Posting API; veja o README).
    # Redirecionamento cadastrado no app: http://localhost:8800/oauth/tiktok/callback
    credencial: segredos/tiktok_app.json   # {"client_key": "...", "client_secret": "..."}
    modo: rascunho   # padrão da janela de publicar: rascunho (você publica pelo app, pode ser público)
                     # ou direto (com legenda; sem auditoria do TikTok: só conta privada e vídeo "Só eu")

canais:
  alanzoka:
    plataforma: twitch
    login: alanzoka
    url: https://www.twitch.tv/alanzoka
    canal_destino: Cortes do Alanzoka
    credito: twitch.tv/alanzoka
    # Recorte da facecam no vídeo original (pixels, em 1920x1080).
    # Deixe null até medir; sem facecam o corte usa fundo desfocado.
    facecam: {x: 1489, y: 271, w: 420, h: 268}   # medido no VOD 2932200023 (canto sup. direito, sem a barra do "último sub")

  paulinholokobr:
    plataforma: kick
    login: paulinholokobr
    url: https://kick.com/paulinholokobr
    canal_destino: Cortes do Paulinho o LOKO
    credito: kick.com/paulinholokobr
    facecam: null

  coringa:
    plataforma: kick
    login: coringa
    url: https://kick.com/coringa
    canal_destino: Cortes do Coringa
    credito: kick.com/coringa
    facecam: null

  bisteconee:
    plataforma: twitch
    login: bisteconee
    url: https://www.twitch.tv/bisteconee
    canal_destino: "Cortes do Bistecone"
    credito: twitch.tv/bisteconee
    facecam: null   # ajuste pelo botão “Ajustar enquadramento” depois de baixar um trecho

kick_api:
  # Crie um app em https://kick.com/settings/developer e preencha via variáveis de ambiente:
  #   KICK_CLIENT_ID e KICK_CLIENT_SECRET
  porta_webhook: 8787
